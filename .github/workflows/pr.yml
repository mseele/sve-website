name: PR checks

on:
  workflow_dispatch:
  pull_request:
  push:
    # Development lands on `next` and is promoted to `main`; gate both.
    branches: [main, next]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# PR gate for the website. `bun run check` runs oxlint, astro sync, tsrs,
# vitest, and the Playwright e2e suite. Unlike the e2e build, astro sync
# fetches live sources (backend events, Contentful), so the check job runs
# with real credentials from repo secrets — parity with the dev machine.
# Runs stay red until the secrets are set (see the wizard in the PR).
# Netlify still handles deploy previews; nothing here deploys.

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Check
        run: bun run check
        env:
          # Real sources for astro sync's content fetch, matching the dev
          # machine. Values live as repo secrets; PREVIEW is hardcoded to
          # production semantics.
          BACKEND_API: ${{ secrets.BACKEND_API }}
          PREVIEW: 'false'
          CAPTCHA_SITE_KEY: ${{ secrets.CAPTCHA_SITE_KEY }}
          CONTENTFUL_SPACE_ID: ${{ secrets.CONTENTFUL_SPACE_ID }}
          CONTENTFUL_DELIVERY_TOKEN: ${{ secrets.CONTENTFUL_DELIVERY_TOKEN }}
          CONTENTFUL_PREVIEW_TOKEN: ${{ secrets.CONTENTFUL_PREVIEW_TOKEN }}
          SUBDOMAIN: ${{ secrets.SUBDOMAIN }}
